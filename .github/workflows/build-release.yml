name: Build Gooby RCON EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read app version
        shell: pwsh
        run: |
          $version = python -c 'import ast, pathlib
          source = pathlib.Path("app.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          version = ""
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "BUILDID":
                          if isinstance(node.value, ast.Constant):
                              version = str(node.value.value)
                          elif isinstance(node.value, ast.Call) and isinstance(node.value.func, ast.Name) and node.value.func.id == "str" and node.value.args and isinstance(node.value.args[0], ast.Constant):
                              version = str(node.value.args[0].value)
                          break
          print(version)'
          if (-not $version) {
            throw "Could not determine app version from app.py"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Gooby RCON EXE
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name Gooby_RCON --icon assets/icon.ico --add-data "assets/icon.ico;assets" app.py

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Gooby RCON v${{ env.VERSION }}
          files: dist/Gooby_RCON.exe
          draft: false
          prerelease: false
          generate_release_notes: true
