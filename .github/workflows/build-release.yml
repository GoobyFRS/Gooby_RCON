name: Build Gooby RCON EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read app version
        shell: pwsh
        run: |
          $version = python -c "import re, pathlib; text = pathlib.Path('app.py').read_text(encoding='utf-8'); m = re.search(r'BUILDID\s*=\s*str\((?:\"|\')([^\"\']+)(?:\"|\')\)', text); print(m.group(1) if m else '')"
          if (-not $version) {
            throw "Could not determine app version from app.py"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Gooby RCON EXE
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name Gooby_RCON app.py

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Gooby RCON v${{ env.VERSION }}
          files: dist/Gooby_RCON.exe
          draft: false
          prerelease: false
          generate_release_notes: true
